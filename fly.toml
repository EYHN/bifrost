app = "bifrost-gateway-eyhn-nrt"
primary_region = "nrt"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  APP_PORT = "8080"
  APP_HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  LOG_STYLE = "json"
  PG_PORT = "5432"
  PG_DB_NAME = "bifrost"
  PG_SSL_MODE = "require"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
